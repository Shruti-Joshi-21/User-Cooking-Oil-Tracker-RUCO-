# Local Kafka for the RUCO oil tracker (single broker, KRaft mode = no Zookeeper).
# Start:  docker compose up -d      Stop:  docker compose down
# Spark will be added to this file in a later step.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"            # Windows host (our Python producer) connects to localhost:9092
    environment:
      # --- KRaft: this one node is both the broker and the controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners ---
      # HOST   : for programs on Windows      -> localhost:9092
      # DOCKER : for other containers (Spark) -> kafka:29092
      # CONTROLLER : internal KRaft traffic
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # --- Single broker, so every replication factor must be 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:               # "healthy" once the broker answers requests
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot helper: waits until Kafka is healthy, creates the topic, then exits.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists --topic oil-readings
      --partitions 1 --replication-factor 1

  # Spark Structured Streaming job (streaming/stream_processor.py), runs in local mode.
  # Also used to train the model:  docker compose exec spark /opt/spark/bin/spark-submit /opt/app/model/train_model.py
  spark:
    build: ./streaming         # official Spark 3.5.3 image + numpy for MLlib (see streaming/Dockerfile)
    image: oil-tracker-spark
    container_name: spark
    user: root                 # avoids permission problems when writing to ./output
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "4040:4040"            # Spark web UI -> http://localhost:4040 (Structured Streaming tab)
    environment:
      PYTHONUNBUFFERED: "1"    # show print() output in the logs immediately
    volumes:
      - ./streaming:/opt/app/streaming
      - ./output:/opt/app/output
      - ./data:/opt/app/data
      - ./model:/opt/app/model
      - ivy-cache:/opt/ivy     # keeps the downloaded Kafka connector between runs
    # Connector version MUST match Spark: Spark 3.5.3 (Scala 2.12) -> spark-sql-kafka-0-10_2.12:3.5.3
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --conf spark.jars.ivy=/opt/ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      /opt/app/streaming/stream_processor.py

volumes:
  ivy-cache:
